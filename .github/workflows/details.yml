name: details

on:
  schedule:
    # Every 2 hours: specs, descriptions and campaigns change rarely, and each run reads
    # about 400 product pages. Price and stock come from the 15-minute catalog instead.
    - cron: "41 */2 * * *"
  workflow_dispatch:
    inputs:
      workers:
        description: Product pages read at a time
        default: "4"
      delay:
        description: Seconds to wait after each page, per worker
        default: "0"
      budget:
        description: Seconds before the run stops starting pages
        default: "900"

permissions:
  contents: write

concurrency:
  group: details
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Start from the last published files: a run that stops at its time budget keeps
      # the older files for the pages it didn't reach.
      - name: Previous details
        run: |
          git clone -q --depth 1 -b details "https://github.com/${{ github.repository }}.git" "$RUNNER_TEMP/details" \
            && rm -rf "$RUNNER_TEMP/details/.git" || mkdir -p "$RUNNER_TEMP/details"
      - name: Read the product pages
        run: python snapshot.py details "$RUNNER_TEMP/details"
        env:
          DETAILS_WORKERS: ${{ inputs.workers || '4' }}
          DETAILS_DELAY_S: ${{ inputs.delay || '0' }}
          DETAILS_BUDGET_S: ${{ inputs.budget || '900' }}
      # The details branch holds one commit with <product id>.json files, replaced on
      # every run. A separate branch from data, so the two workflows never overwrite each other.
      - name: Publish to the details branch
        run: |
          cd "$RUNNER_TEMP/details"
          git init -q -b details
          git add .
          git -c user.name="catalog bot" -c user.email="actions@users.noreply.github.com" \
            commit -q -m "Product details $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" details
